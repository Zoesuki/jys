# 本地部署全栈编排（组织自有服务器）。见 docs/架构设计文档.md §2.4
services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/certs:/etc/nginx/certs:ro
      - web_dist:/usr/share/nginx/html:ro
      - uploads:/data/uploads:ro
    depends_on: [api]
  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    environment:
      PORT: 3000
      DATABASE_URL: mysql://jys:${MYSQL_PASSWORD:-jys_dev_password}@mysql:3306/jys
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?set-in-env}
      SMTP_HOST: ${SMTP_HOST:-}
      UPLOAD_DIR: /data/uploads
    volumes:
      - uploads:/data/uploads
    depends_on: [mysql, redis]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set-in-env}
      MYSQL_DATABASE: jys
      MYSQL_USER: jys
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-jys_dev_password}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      retries: 5
  redis:
    image: redis:7.4-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
volumes:
  mysql_data:
  redis_data:
  uploads:
  web_dist:
