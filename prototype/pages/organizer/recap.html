<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>出勤统计与活动回顾 · 吉悠社成员中心</title>
<!-- O4 出勤统计与活动回顾 | 活动组织者 | ← PRD 5.4 D6/D7 / SRS FR-D6/D7、FR-G2（P9-18 自动发放）
     交互：出席率统计、奖励发放确认（自动口径说明）、活动回顾编辑（图文，过敏感词） -->
<link rel="stylesheet" href="../../assets/tokens.css">
<script src="https://cdn.tailwindcss.com"></script>
<script src="../../assets/prototype.js"></script>
</head>
<body class="jys" data-page-title="出勤统计与活动回顾" data-page-group="organizer" data-trace="PRD 5.4 D6/D7 / SRS FR-D6/D7、FR-G2（P9-18）" data-states="normal,empty">
<main class="max-w-5xl mx-auto px-4 pb-10">

  <div data-when="normal" class="space-y-5">
    <!-- 统计 -->
    <section class="jys-card p-6">
      <div class="flex items-center gap-2 mb-4 flex-wrap"><h3 class="font-bold text-lg">周六桌游面杀 · 第 14 期（已结束）</h3><span class="jys-badge jys-badge-success jys-badge-dot">奖励已自动发放</span></div>
      <div class="grid grid-cols-4 gap-3 text-center">
        <div class="jys-sunken p-4"><p style="font-size:22px;font-weight:800;color:var(--jys-primary)">14</p><p class="text-xs" style="color:var(--jys-text-2)">有效报名</p></div>
        <div class="jys-sunken p-4"><p style="font-size:22px;font-weight:800;color:var(--jys-primary)">12</p><p class="text-xs" style="color:var(--jys-text-2)">已签到</p></div>
        <div class="jys-sunken p-4"><p style="font-size:22px;font-weight:800;color:var(--jys-primary)">85.7%</p><p class="text-xs" style="color:var(--jys-text-2)">出席率</p></div>
        <div class="jys-sunken p-4"><p style="font-size:22px;font-weight:800;color:var(--jys-primary)">2</p><p class="text-xs" style="color:var(--jys-text-2)">未出席</p></div>
      </div>
      <div class="jys-sunken p-4 mt-4 text-xs" style="color:var(--jys-text-2)">
        ✅ 奖励已按出勤记录自动发放：12 名出席成员各获得 <b>经验 +50 · 积分 +20</b>（后台可配置，P9-16）；发放幂等（同活动同成员仅一次）。如需修正，由管理员通过调整流水冲正（P9-18），未出席者不发放。
      </div>
    </section>

    <!-- 回顾编辑 -->
    <section class="jys-card p-6">
      <h3 class="font-bold mb-4">发布活动回顾（图文）</h3>
      <div class="space-y-4">
        <div>
          <label class="jys-label jys-required">回顾标题</label>
          <input class="jys-input" value="第 14 期回顾：12 人车踏平钟楼村，首次出现双邪教局！">
        </div>
        <div>
          <label class="jys-label">回顾正文</label>
          <textarea class="jys-input" rows="6">上周末的面杀直接爆满！血染钟楼开了三车，最刺激的是最后一车暗流涌动：小恶魔自刀两晚骗过所有人，最后被茶壶一票送走……感谢各位捧场，第 15 期见！（内容将过敏感词校验 FR-B5）</textarea>
        </div>
        <div class="flex gap-3 flex-wrap">
          <div class="jys-sunken p-2 text-center" style="width:120px"><img src="https://placehold.co/104x70/FFF1E4/C2410C?text=%E5%90%88%E7%85%A7" alt="现场照片" class="rounded" onerror="this.onerror=null;this.src='https://placehold.co/104x70/F3F4F6/9CA3AF?text=%E5%9B%BE%E7%89%87'"><p class="text-[10px] mt-1" style="color:var(--jys-text-2)">photo-01.jpg</p></div>
          <button class="jys-btn jys-btn-outline" style="width:120px;height:84px">＋ 添加照片</button>
        </div>
        <div class="flex gap-2">
          <button class="jys-btn jys-btn-primary">发布回顾</button>
          <button class="jys-btn jys-btn-ghost">存草稿</button>
        </div>
      </div>
    </section>
  </div>

  <div data-when="empty"><div class="jys-card"><div class="jys-empty"><div class="jys-empty-icon">📊</div><p class="font-bold" style="color:var(--jys-text-1)">暂无可统计的活动</p><p class="text-xs mt-1">活动结束后这里会出现出勤统计与回顾入口</p></div></div></div>
</main>
</body>
</html>
