# 开发环境：仅起 MySQL/Redis，前后端本地热重载（pnpm dev:api / pnpm dev:web）
services:
  mysql:
    image: mysql:8.4
    ports: ["3306:3306"]
    environment:
      MYSQL_ROOT_PASSWORD: jys_dev_root
      MYSQL_DATABASE: jys
      MYSQL_USER: jys
      MYSQL_PASSWORD: jys_dev_password
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_dev:/var/lib/mysql
  redis:
    image: redis:7.4-alpine
    ports: ["6379:6379"]
    command: redis-server --appendonly yes
    volumes:
      - redis_dev:/data
volumes:
  mysql_dev:
  redis_dev:
